<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de FiO2</title>
<style>

    body {

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      padding: 20px;

      background-color: #f4f4f4;

    }
 
    table {

      border-collapse: collapse;

      text-align: center;

      background-color: #ffffff;

      border: 3px solid #000000;

    }
 
    th {

      background-color: #000000;

      color: #ffffff;

      padding: 10px;

      font-size: 16px;

      border: 1px solid #000000;

    }
 
    td {

      padding: 6px 15px;

      font-weight: bold;

      font-size: 15px;

      border: 1px solid #000000;

    }
    .bg-grey {

      background-color: #c0c0c0;

    }
 
    .bg-white {

      background-color: #ffffff;

    }
 
    .total-flow {

      font-size: 24px;

      font-weight: bold;

      vertical-align: middle;

    }
</style>
</head>
<body>
 
  <table>
<thead>
<tr>
<th>FiO2</th>
