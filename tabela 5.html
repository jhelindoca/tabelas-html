|<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Frutas</title>

    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        th {
            background-color: yellow;
            font-size: 25px;
            text-align: left;
            padding: 5px;
            border: 1px solid #ccc;
        }

        td {
            border: 1px solid #ccc;
            font-size: 20px;
            padding: 5px;
        }

        .nome {
            width: 50%;
        }

        .imagem {
            width: 80%;
            text-align: center;
        }

        .imagem img {
            width: 150px;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <table>

        <tr>
            <th>Name</th>
            <th>Picture</th>
        </tr>

        <tr>
            <td class="nome">Apple</td>
            <td class="imagem">
                <img src="img/Maça.webp">
            </td>
        </tr>

        <tr>
            <td class="nome">Banana</td>
            <td class="imagem">
                <img src="img/banana.png">
            </td>
        </tr>

        <tr>
            <td class="nome">Peach</td>
            <td class="imagem">
                <img src="img/pessego.webp">
            </td>
        </tr>

    </table>

</body>
</html>
